name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: leapscope_test
          POSTGRES_USER: leapscope_test
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leapscope_test -d leapscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env: 
      LEAPSCOPE_APP_NAME: LeapScope API
      LEAPSCOPE_ENVIRONMENT: test
      LEAPSCOPE_DEBUG: "false"
      LEAPSCOPE_DATABASE_URL: postgresql+psycopg://leapscope_test:test-password@127.0.0.1:5432/leapscope_test
      LEAPSCOPE_TEST_DATABASE_URL: postgresql+psycopg://leapscope_test:test-password@127.0.0.1:5432/leapscope_test

    
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Check for missing migrations
        run: python -m alembic check

      - name: Run tests
        run: python -m pytest -v
      