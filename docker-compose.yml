services:
  
  api:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      LEAPSCOPE_APP_NAME: ${LEAPSCOPE_APP_NAME}
      LEAPSCOPE_ENVIRONMENT: ${LEAPSCOPE_ENVIRONMENT}
      LEAPSCOPE_DEBUG: ${LEAPSCOPE_DEBUG}
      LEAPSCOPE_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition:  service_healthy

  db:
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  test-db:
    image: postgres:18-alpine
    profiles: ["test"]

    environment: 
      POSTGRES_DB: leapscope_test
      POSTGRES_USER: leapscope_test
      POSTGRES_PASSWORD: test-password

    ports:
      - "127.0.0.1:5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s



volumes:
  postgres_data: