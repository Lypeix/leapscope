[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "leapscope"
version = "0.1.0"
description = "Desktop activity analytics and personalized notifications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "fastapi",
    "psycopg[binary]",
    "pydantic-settings",
    "sqlalchemy",
    "uvicorn[standard]",
    "pydantic[email]",
    "tzdata",
    "pwdlib[argon2]",
    "pyjwt",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*", "collector*"]

