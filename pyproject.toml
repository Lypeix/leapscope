[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "leapscope"
version = "0.1.0"
description = "Desktop activity analytics and personalized notifications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "psycopg[binary]",
    "pydantic-settings",
    "sqlalchemy",
    "uvicorn[standard]",
]

[tool.setuptools.packages.find]
include = ["app*", "collector*"]